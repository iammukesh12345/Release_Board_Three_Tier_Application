<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Release board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Hello Guys, Welcome to my Dashboard</h1>
      <p id="count" aria-live="polite"></p>
    </header>

    <form id="add-form" autocomplete="off">
      <label for="title" class="sr">New release task</label>
      <input id="title" maxlength="200" placeholder="Add a release task, e.g. Run smoke tests on staging" required>
      <button type="submit">Add task</button>
    </form>

    <ul id="list"></ul>
    <p id="empty" hidden>No tasks yet. Add the first step of your release above.</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
