server.port=8080

# Database (override with env vars in Docker / Kubernetes)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/releaseboard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
